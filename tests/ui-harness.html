<!doctype html>
<html lang="vi">
<head>
  <script>window.__app_initialized = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SKU Pricing UI Harness</title>
  <link rel="stylesheet" href="../style.css">
  <meta id="mock-xlsx-output" data-json="[]">
  <script>
    const encodeColumn = index => {
      let result = '';
      for (let value = index; value >= 0; value = Math.floor(value / 26) - 1) {
        result = String.fromCharCode(65 + (value % 26)) + result;
      }
      return result;
    };
    const XLSX = {
      utils: {
        book_new: () => ({ SheetNames: [], Sheets: {} }),
        aoa_to_sheet: rows => ({ __rows: rows }),
        json_to_sheet: (rows, options = {}) => {
          const headers = options.header || Object.keys(rows[0] || {});
          return { __rows: [headers, ...rows.map(row => headers.map(header => row[header]))] };
        },
        book_append_sheet: (workbook, sheet, name) => {
          workbook.SheetNames.push(name);
          workbook.Sheets[name] = sheet;
        },
        encode_col: encodeColumn,
        encode_cell: ({ r, c }) => `${encodeColumn(c)}${r + 1}`,
        sheet_to_json: sheet => sheet.__rows
      },
      read: () => ({
        SheetNames: ['Nhap Gia'],
        Sheets: {
          'Nhap Gia': {
            __rows: [
              ['Mã SKU', 'Tên sản phẩm', 'Hãng sơn', 'Quy cách', 'Giá chung [standard]', 'BG03 [bg03]'],
              ['BA-46-LON', 'Sơn siêu bóng ngoại thất đặc biệt Nano', 'MUTSUTEC NANO', 'Lon 5,3 kg', 2116000, 1999000]
            ]
          }
        }
      }),
      writeFile: (workbook, name) => {
        const output = document.getElementById('mock-xlsx-output');
        const written = JSON.parse(output.getAttribute('data-json'));
        written.push({ workbook, name });
        output.setAttribute('data-json', JSON.stringify(written));
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="padding: 16px;">
  <main>
    <section id="products-panel" class="panel active">
      <div class="glass-panel">
        <div class="panel-header">

          <button id="btn-export-products-excel" class="btn btn-secondary btn-sm">Xuất Excel sản phẩm</button>
        </div>
        <div class="controls-row">
          <input id="product-search-input" class="form-control-search" placeholder="Tìm SKU">
          <select id="product-brand-filter" class="form-control"></select>

            <option value="inactive">Ngừng áp dụng</option>

        </div>
        <div class="table-responsive">

            <thead>

    </section>

    <section id="pricelists-panel" class="panel active" style="margin-top: 18px;">
      <div class="glass-panel">
        <div class="panel-header">

          <div>
            <button id="btn-export-pricelist-excel" class="btn btn-secondary btn-sm">Xuất Excel bảng giá</button>

            <button id="mock-import-price-excel" class="btn btn-secondary btn-sm">Chạy nhập thử</button>
            <input type="file" id="pricelist-excel-file-input" accept=".xlsx,.xls" hidden>
            <button id="btn-save-price-matrix" class="btn btn-success btn-sm" disabled>Lưu tất cả thay đổi</button>
          </div>
        </div>
        <div class="controls-row" style="display:grid;grid-template-columns:minmax(240px,1.2fr) minmax(220px,1fr) repeat(3,minmax(150px,.7fr));gap:.75rem;">
          <input id="price-matrix-product-search" class="form-control-search" placeholder="Tìm SKU theo mã, tên, hãng, quy cách">
          <details class="price-list-picker" id="pricelist-visible-picker">
            <summary id="pricelist-visible-summary">Chọn bảng giá hiển thị</summary>
            <div class="price-list-picker-menu" id="pricelist-visible-select"></div>
          </details>
          <select id="price-matrix-brand-filter" class="form-control"></select>
          <select id="price-matrix-package-filter" class="form-control"></select>
          <select id="price-matrix-group-filter" class="form-control"></select>
        </div>
        <div class="table-responsive price-matrix-wrap">
          <table class="table price-matrix-table"><thead></thead><tbody id="pricelists-table-body"></tbody></table>
        </div>
      </div>
    </section>
  </main>
